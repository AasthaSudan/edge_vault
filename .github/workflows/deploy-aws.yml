name: Deploy to AWS

# Every push to main redeploys the hosted demo (https://edgevault-dosaos.duckdns.org).
# GitHub signs in to AWS with a short-lived OIDC token: no AWS keys are stored here, and the
# role can only run the fixed "EdgeVault-Deploy" command on the demo server. That command
# pulls main on the server and rebuilds only what changed (dashboard, edge, cloud, Python deps).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-002df9d18de69dad1
  SITE_URL: https://edgevault-dosaos.duckdns.org

jobs:
  deploy:
    name: Deploy to the demo server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::251929332238:role/EdgeVaultGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and rebuild on the server
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name EdgeVault-Deploy \
            --comment "GitHub ${GITHUB_SHA::7}" --query Command.CommandId --output text)
          echo "SSM command $id"
          for i in $(seq 1 150); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ] || { echo "::error::Deploy finished with status $status"; exit 1; }

      - name: Check the live site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/")
          echo "$SITE_URL answered $code"
          [ "$code" = 200 ]
