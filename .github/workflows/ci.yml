name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Edge tests + privacy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: fastembed-bge-small-en-v1.5
      - run: python edge/scripts/provision_models.py
      - name: Import contract (sync can never reach the LLM, assistant or gate context)
        run: lint-imports
        env: { PYTHONPATH: edge }
      - name: Privacy, taint, durability, gate and memory tests (no Ollama: exercises fail-closed paths)
        run: pytest edge/tests -q --ignore=edge/tests/test_sync.py --ignore=edge/tests/test_search.py
        env: { PYTHONPATH: edge, DEVICE_ID: ci-unit }
      - name: Search accuracy + latency (seeded device)
        run: |
          python edge/scripts/seed_notes.py
          pytest edge/tests/test_search.py -q
        env: { PYTHONPATH: edge, DEVICE_ID: ci-search }

  sync:
    name: Edge-cloud sync integration
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/models
          key: fastembed-bge-small-en-v1.5
      - run: python edge/scripts/provision_models.py
      - name: Start the cloud sync API
        run: |
          uvicorn sync_api.main:app --app-dir cloud --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
      - name: Push/pull, conflicts, versioning, server-clock pull, corroboration
        run: python edge/tests/test_sync.py
        env: { PYTHONPATH: edge, DEVICE_ID: ci-sync }

  cloud-image:
    name: Cloud image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edgevault-sync-api:ci ./cloud

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
