[project]
name = "edgevault-edge"
version = "0.1.0"
description = "EdgeVault on-device node"
requires-python = ">=3.11"
dependencies = [
    "qdrant-edge-py>=0.8.0",
    "fastembed>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
