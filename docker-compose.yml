version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: edgevault-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/cloud_qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=0
      - QDRANT__LOG_LEVEL=INFO
